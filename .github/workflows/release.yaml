name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Check that the tag matches the version
        run: |
          version=$(grep '^cloak.version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match cloak.version=$version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Run unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Restore the release keystore
        env:
          KEYSTORE_B64: ${{ secrets.CLOAK_KEYSTORE_B64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "CLOAK_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build the signed release APK
        env:
          CLOAK_KEYSTORE_PASSWORD: ${{ secrets.CLOAK_KEYSTORE_PASSWORD }}
          CLOAK_KEY_ALIAS: ${{ secrets.CLOAK_KEY_ALIAS }}
          CLOAK_KEY_PASSWORD: ${{ secrets.CLOAK_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Verify the signing certificate
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs "$apk" | tee certs.txt
          actual=$(grep -m1 'certificate SHA-256 digest' certs.txt | awk '{print $NF}')
          expected=$(tr -d '[:space:]' < docs/release-cert.sha256)
          if [ "$actual" != "$expected" ]; then
            echo "The APK is not signed with the release certificate" >&2
            exit 1
          fi

      - name: Name the files and write checksums
        run: |
          mkdir dist
          cp app/build/outputs/apk/release/app-release.apk "dist/Cloak-$VERSION.apk"
          cd dist
          sha256sum "Cloak-$VERSION.apk" > "Cloak-$VERSION.apk.sha256"

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          case "$VERSION" in 0.*) flags="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* \
            --draft $flags \
            --title "Cloak $VERSION" \
            --generate-notes \
            --notes-file .github/release-body.md

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"